name: Java CI with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # Esto compila tu código y genera el archivo .jar
      run: ./mvnw clean package -DskipTests

    - name: Build Docker Image
      # Esto verifica que tu Dockerfile funcione correctamente
      run: docker build -t mi-app-spring:latest .